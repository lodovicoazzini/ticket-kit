<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jira actions</title>
<link rel="stylesheet" href="menu.css">
<script type="module" src="menu.js"></script>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="palette" role="dialog" aria-label="Jira actions">
  <div class="head">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
    <button type="button" class="crumb" id="crumb" hidden title="Back to all actions"></button>
    <input type="text" id="q" autocomplete="off" spellcheck="false" autofocus
      aria-label="Search actions and tickets" aria-controls="list" aria-activedescendant="">
  </div>
  <div class="ctx" id="ctx"></div>
  <div class="list" id="list" role="listbox" aria-label="Actions"></div>
  <div class="foot" id="foot"></div>
</div>
</body>
</html>
